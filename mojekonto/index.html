<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Konto - 6 w Dzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#FAFAFC] text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-purple-100">
        <div class="max-w-6xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="https://6wdzienniku.vercel.app">
                <img src="https://6wdzienniku.vercel.app/6-content/logo_6wdzienn_kolor.png" alt="6 w Dzienniku" class="h-16 w-auto object-contain">
            </a>
            <a href="/sklep" class="text-sm font-semibold text-[#5B21B6] hover:text-[#EC4899]">← Powrót do Sklepu</a>
        </div>
    </header>

    <div id="auth-container" class="max-w-md mx-auto my-auto p-8 bg-white rounded-3xl border border-purple-100 shadow-xl w-full">
        <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-slate-900">Logowanie</h2>
        <form onsubmit="event.preventDefault(); handleAuth();" class="space-y-4">
            <input type="text" id="reg-name" placeholder="Imię i Nazwisko" class="w-full border p-3 rounded-xl hidden">
            <input type="email" id="auth-email" placeholder="Adres e-mail" class="w-full border p-3 rounded-xl" required>
            <input type="password" id="auth-pass" placeholder="Hasło" class="w-full border p-3 rounded-xl" required>
            <button type="submit" id="auth-submit-btn" class="w-full bg-[#5B21B6] hover:bg-[#4c1d95] text-white py-3 rounded-xl font-bold transition">Zaloguj się</button>
            <div class="flex justify-between text-xs text-[#5B21B6] pt-2">
                <button type="button" id="toggle-mode-btn" onclick="toggleAuthMode('register')" class="hover:underline">Zarejestruj się</button>
                <button type="button" onclick="resetPassword()" class="hover:underline">Zapomniałem hasła</button>
            </div>
        </form>
    </div>

    <main id="account-panel" class="max-w-6xl mx-auto px-6 py-12 w-full hidden flex-grow">
        <div class="mb-8">
            <h1 id="welcome-msg" class="text-3xl font-extrabold text-slate-900">Witaj!</h1>
            <div id="last-order-box" class="mt-4 p-4 bg-purple-50 rounded-2xl text-sm border border-purple-100 text-purple-900"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <div class="space-y-2">
                <button onclick="showTab('orders')" class="w-full text-left p-3 rounded-xl font-semibold bg-white border border-purple-100 hover:bg-purple-50 transition">Moje zamówienia</button>
                <button onclick="showTab('access')" class="w-full text-left p-3 rounded-xl font-semibold bg-white border border-purple-100 hover:bg-purple-50 transition">Moje dostępy</button>
                <button onclick="showTab('reviews')" class="w-full text-left p-3 rounded-xl font-semibold bg-white border border-purple-100 hover:bg-purple-50 transition">Moje opinie</button>
                <button onclick="logout()" class="w-full text-left p-3 rounded-xl font-semibold text-red-500 bg-white border border-red-100 hover:bg-red-50 transition">Wyloguj się</button>
            </div>

            <div class="md:col-span-3 bg-white p-6 rounded-2xl border border-purple-100 shadow-sm">
                <div id="tab-orders" class="tab-content space-y-4"></div>

                <div id="tab-access" class="tab-content space-y-4 hidden"></div>

                <div id="tab-reviews" class="tab-content hidden">
                    <h3 class="font-bold text-lg mb-4">Wystaw opinię do zakupionego produktu</h3>
                    <form id="review-form" class="space-y-4">
                        <select id="rev-product" class="w-full border p-3 rounded-xl">
                            <option value="">Wybierz produkt...</option>
                        </select>
                        <select id="rev-rating" class="w-full border p-3 rounded-xl">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                        <textarea id="rev-comment" placeholder="Napisz opinię o produkcie..." class="w-full border p-3 rounded-xl h-28"></textarea>
                        <button type="button" onclick="submitReview()" class="bg-[#5B21B6] hover:bg-[#4c1d95] text-white px-6 py-3 rounded-xl font-bold transition">Wyślij opinię</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full bg-white border-t border-purple-100 py-6 text-center text-xs text-slate-400 mt-12">
        &copy; 6 w Dzienniku. Wszelkie prawa zastrzeżone.
    </footer>

    <script>
        const SUPABASE_URL = "https://aouuylcmewkowgpijuci.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdXV5bGNtZXdrb3dncGlqdWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTM3NDcsImV4cCI6MjEwNTkyOTc0N30.IFGjFzXYzJyN8QjKAs1Zoslyx7Nv3xFFv7SND7xsE0g";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'login';

        function toggleAuthMode(mode) {
            currentMode = mode;
            const isRegister = mode === 'register';

            document.getElementById('reg-name').classList.toggle('hidden', !isRegister);
            document.getElementById('auth-title').innerText = isRegister ? 'Rejestracja' : 'Logowanie';
            document.getElementById('auth-submit-btn').innerText = isRegister ? 'Zarejestruj się' : 'Zaloguj się';
            
            const toggleBtn = document.getElementById('toggle-mode-btn');
            if (isRegister) {
                toggleBtn.innerText = "Masz już konto? Zaloguj się";
                toggleBtn.setAttribute('onclick', "toggleAuthMode('login')");
            } else {
                toggleBtn.innerText = "Zarejestruj się";
                toggleBtn.setAttribute('onclick', "toggleAuthMode('register')");
            }
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-pass').value.trim();

            if (!email || !password) {
                alert("Wypełnij pole e-mail oraz hasło.");
                return;
            }

            if (currentMode === 'register') {
                const name = document.getElementById('reg-name').value.trim();
                if (!name) {
                    alert("Podaj imię i nazwisko.");
                    return;
                }

                const { data, error } = await supabase.auth.signUp({ email, password });

                if (error) {
                    alert("Błąd rejestracji: " + error.message);
                    return;
                }

                if (data.user) {
                    await supabase.from('profiles').insert({
                        id: data.user.id,
                        full_name: name,
                        email: email
                    });
                    
                    alert("Konto zostało pomyślnie utworzone! Możesz się teraz zalogować.");
                    toggleAuthMode('login');
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Błąd logowania: " + error.message);
                } else {
                    location.reload();
                }
            }
        }

        async function resetPassword() {
            const email = document.getElementById('auth-email').value.trim();
            if (!email) return alert("Podaj adres e-mail, aby zresetować hasło.");
            
            const { error } = await supabase.auth.resetPasswordForEmail(email, { 
                redirectTo: window.location.origin + '/mojekonto' 
            });

            if (error) alert("Błąd: " + error.message);
            else alert("Link do resetu hasła został wysłany na podany e-mail.");
        }

        async function initDashboard() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('account-panel').classList.remove('hidden');

            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('welcome-msg').innerText = `Witaj, ${profile.full_name}`;
            }

            const { data: orders } = await supabase.from('orders').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
            if (orders && orders.length > 0) {
                const last = orders[0];
                const extraCount = last.items.length - 1;
                document.getElementById('last-order-box').innerHTML = `
                    <strong>Ostatnie zamówienie:</strong> ${last.order_number} (${last.items[0].title} ${extraCount > 0 ? `i ${extraCount} więcej` : ''}) 
                    <br><button onclick="showTab('orders')" class="text-[#5B21B6] font-semibold underline text-xs mt-1">Zobacz szczegóły</button>
                `;

                document.getElementById('tab-orders').innerHTML = orders.map(o => `
                    <div class="border p-4 rounded-xl">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-slate-900">${o.order_number}</span>
                            <span class="text-xs text-slate-400">${new Date(o.created_at).toLocaleDateString()}</span>
                        </div>
                        <p class="text-sm font-semibold text-[#5B21B6] mb-2">Kwota: ${o.total_amount} PLN</p>
                        <ul class="list-disc ml-5 text-xs text-slate-600">
                            ${o.items.map(i => `<li>${i.title} -${i.price} PLN</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            } else {
                document.getElementById('tab-orders').innerHTML = `<p class="text-slate-400 text-sm">Nie złożono jeszcze żadnych zamówień.</p>`;
            }

            const { data: access } = await supabase.from('user_access').select('*').eq('user_id', user.id);
            if (access && access.length > 0) {
                document.getElementById('tab-access').innerHTML = access.map(a => `
                    <div class="border p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <p class="font-bold text-slate-900">${a.file_title}</p>
                            <p class="text-xs text-slate-400">Typ pliku: ${(a.file_type || 'plik').toUpperCase()}</p>
                        </div>
                        <a href="${a.file_url}" target="_blank" download class="bg-[#5B21B6] hover:bg-[#4c1d95] text-white text-xs px-4 py-2 rounded-xl font-bold transition">Pobierz plik</a>
                    </div>
                `).join('');

                // Wypełnienie listy w zakładce opinii
                const selectRev = document.getElementById('rev-product');
                selectRev.innerHTML = '<option value="">Wybierz zakupiony produkt...</option>' + 
                    access.map(a => `<option value="${a.product_id}">${a.file_title}</option>`).join('');
            } else {
                document.getElementById('tab-access').innerHTML = `<p class="text-slate-400 text-sm">Brak aktywnych dostępów cyfrowych.</p>`;
            }
        }

        async function submitReview() {
            const { data: { user } } = await supabase.auth.getUser();
            const productId = document.getElementById('rev-product').value;
            const rating = parseInt(document.getElementById('rev-rating').value);
            const comment = document.getElementById('rev-comment').value.trim();

            if (!productId || !comment) {
                alert("Wybierz produkt i wpisz treść opinii.");
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', user.id).single();

            const { error } = await supabase.from('reviews').insert({
                product_id: productId,
                user_id: user.id,
                user_name: profile ? profile.full_name : 'Klient',
                rating: rating,
                comment: comment,
                is_approved: false
            });

            if (error) {
                alert("Błąd podczas dodawania opinii: " + error.message);
            } else {
                alert("Dziękujemy! Twoja opinia została przekazana do weryfikacji przez administratora.");
                document.getElementById('rev-comment').value = '';
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = "https://6wdzienniku.vercel.app";
        }

        initDashboard();
    </script>
</body>
</html>
