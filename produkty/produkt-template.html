<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt - 6WDzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="https://files-6wdzienniku.vercel.app/content/6wd/logo_favicon_6.svg">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandViolet: '#5B21B6', brandPink: '#EC4899' },
                    fontFamily: { sans: ['"Open Sans"', 'sans-serif'], condensed: ['"Open Sans Condensed"', 'sans-serif'] },
                    borderRadius: { 'custom': '10px' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #FAFAFC; color: #1F2937; }
        h1, h2, h3, .font-condensed { font-family: 'Open Sans Condensed', sans-serif; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

    <div id="toast" class="fixed top-5 right-5 z-50 opacity-0 pointer-events-none transition-opacity duration-300 bg-gray-900 text-white px-5 py-3 rounded-custom shadow-xl border border-purple-500/30 flex items-center gap-3">
        <span id="toast-message" class="text-sm font-medium">Powiadomienie</span>
    </div>

    <div id="lightbox" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <div class="relative max-w-4xl max-h-[90vh]">
            <button class="absolute -top-10 right-0 text-white text-xl font-bold p-2 hover:text-brandPink">&times; Zamknij</button>
            <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-custom border border-white/20 shadow-2xl">
        </div>
    </div>

    <header class="w-full bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
            <a href="https://6wdzienniku.vercel.app/" class="inline-block transition-transform duration-300 hover:scale-105">
                <img src="https://files-6wdzienniku.vercel.app/content/6wd/logo_6wdzienn_kolor.png" alt="6 w dzienniku Logo" class="h-16 sm:h-20 object-contain">
            </a>

            <div class="flex items-center gap-3">
                <a href="/api-login/?login" class="p-2.5 rounded-custom border border-brandViolet text-brandViolet hover:bg-purple-50 transition" title="Logowanie">
                    <svg class="w-5 h-5 stroke-brandViolet" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </a>

                <a href="/koszyk" class="p-2.5 rounded-custom border border-brandPink text-brandPink hover:bg-pink-50 transition relative" title="Koszyk">
                    <svg class="w-5 h-5 stroke-brandPink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-brandPink text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 w-full flex-grow space-y-6">
       <div>
    <button onclick="history.back()" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-brandViolet transition bg-white px-4 py-2 rounded-custom border border-gray-200 shadow-xs cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Wróć do sklepu
    </button>
</div>

        <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 gap-10 bg-white p-8 rounded-custom border border-gray-200 shadow-sm">
            <div class="space-y-4">
                <div class="relative group cursor-pointer overflow-hidden rounded-custom border border-gray-200" onclick="openLightbox(document.getElementById('p-img').src)">
                    <img id="p-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='300' viewBox='0 0 500 300'><rect width='500' height='300' fill='%23f3f4f6'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%239ca3af' font-family='sans-serif' font-size='16'>Ładowanie zdjęcia...</text></svg>" class="w-full h-80 object-cover transition-transform duration-300 group-hover:scale-105" alt="Produkt">
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-semibold gap-1 bg-black/30">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        Powiększ zdjęcie
                    </div>
                </div>
                <div id="p-thumbs" class="flex gap-3 overflow-x-auto pb-2"></div>
            </div>

            <div class="space-y-6">
                <span id="p-category" class="text-xs font-bold uppercase text-brandPink">Kategoria</span>
                <h1 id="p-title" class="text-3xl text-gray-900">Ładowanie produktu...</h1>
                
                <div class="space-y-1">
                    <div class="flex items-baseline gap-3">
                        <span id="p-price" class="text-3xl font-bold text-brandViolet">0.00 PLN</span>
                        <span id="p-old-price" class="text-sm text-gray-400 line-through hidden">0.00 PLN</span>
                    </div>
                    <div id="p-price-30" class="text-[11px] text-gray-400 hidden">Najniższa cena z ostatnich 30 dni: <span></span> PLN</div>
                </div>

                <p id="p-desc" class="text-xs text-gray-600 leading-relaxed"></p>

                <button id="btn-add-cart" onclick="addToCart()" class="w-full py-4 bg-brandViolet text-white font-bold rounded-custom uppercase text-sm hover:bg-purple-900 transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    Dodaj do koszyka
                </button>
            </div>
        </div>
    </main>
  
    <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4 space-y-1">
            <p>© 2026 <b>6WDzienniku</b></p>
            <p>Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://fxksikgdberwgttvglko.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4a3Npa2dkYmVyd2d0dHZnbGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzU3NzYsImV4cCI6MjEwNjAxMTc3Nn0.sKf3vvVbaae5-mdg5zwqrgUl6AkXjENanwhDWbH_PXw";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentProduct = null;
        let productImages = [];

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 4000);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cart-badge');
            if (!badge) return;
            const totalCount = cart.reduce((acc, item) => acc + item.quantity, 0);
            if(totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function changeMainImage(url) {
            document.getElementById('p-img').src = url;
            document.querySelectorAll('.thumb-btn').forEach(btn => {
                if(btn.dataset.url === url) {
                    btn.classList.add('border-brandViolet', 'ring-2', 'ring-brandViolet/50');
                    btn.classList.remove('border-gray-200');
                } else {
                    btn.classList.remove('border-brandViolet', 'ring-2', 'ring-brandViolet/50');
                    btn.classList.add('border-gray-200');
                }
            });
        }

        function openLightbox(url) {
            if(!url || url.includes('data:image')) return;
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            let productId = urlParams.get('id');

            if (!productId) {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                const produktyIndex = pathParts.indexOf('produkty');
                
                if (produktyIndex !== -1 && pathParts[produktyIndex + 1]) {
                    productId = pathParts[produktyIndex + 1];
                } else if (pathParts.length > 0) {
                    productId = pathParts[pathParts.length - 1];
                }
            }

            if (!productId || productId === 'produkty') {
                document.getElementById('p-title').innerText = 'Nie wybrano produktu';
                document.getElementById('p-desc').innerText = 'W adresie URL brakuje identyfikatora produktu.';
                document.getElementById('btn-add-cart').style.display = 'none';
                return;
            }

            const { data: p, error } = await supabaseClient.from('products').select('*').eq('id', productId).maybeSingle();

            if (error || !p) {
                document.getElementById('p-title').innerText = 'Nie znaleziono produktu';
                document.getElementById('p-desc').innerText = 'Produkt nie istnieje w bazie danych.';
                document.getElementById('btn-add-cart').style.display = 'none';
                return;
            }

            currentProduct = p;
            document.title = `${p.title} - 6WDzienniku`;
            document.getElementById('p-title').innerText = p.title;
            document.getElementById('p-category').innerText = p.category || p.kategoria || 'Produkt cyfrowy';
            document.getElementById('p-desc').innerText = p.description || 'Brak opisu.';
            
            productImages = Array.isArray(p.images) && p.images.length > 0 ? p.images : [];
            
            const mainImgElement = document.getElementById('p-img');
            const thumbsContainer = document.getElementById('p-thumbs');

            if (productImages.length > 0) {
                mainImgElement.src = productImages[0];
                
                if (productImages.length > 1) {
                    thumbsContainer.innerHTML = productImages.map((imgUrl, index) => `
                        <button onclick="changeMainImage('${imgUrl}')" data-url="${imgUrl}" class="thumb-btn w-16 h-16 rounded-custom overflow-hidden border-2 ${index === 0 ? 'border-brandViolet ring-2 ring-brandViolet/50' : 'border-gray-200'} shrink-0 transition hover:opacity-80">
                            <img src="${imgUrl}" class="w-full h-full object-cover" alt="Miniaturka ${index + 1}">
                        </button>
                    `).join('');
                } else {
                    thumbsContainer.innerHTML = '';
                }
            } else {
                mainImgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='300' viewBox='0 0 500 300'><rect width='500' height='300' fill='%23f3f4f6'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%239ca3af' font-family='sans-serif' font-size='16'>Brak zdjęcia</text></svg>";
            }

            if(p.is_discounted && p.discount_price !== null) {
                document.getElementById('p-price').innerText = `${parseFloat(p.discount_price).toFixed(2)} PLN`;
                document.getElementById('p-old-price').innerText = `${parseFloat(p.price).toFixed(2)} PLN`;
                document.getElementById('p-old-price').classList.remove('hidden');
            } else {
                document.getElementById('p-price').innerText = `${parseFloat(p.price).toFixed(2)} PLN`;
            }

            if(p.price_before_30_days) {
                const el = document.getElementById('p-price-30');
                el.querySelector('span').innerText = parseFloat(p.price_before_30_days).toFixed(2);
                el.classList.remove('hidden');
            }
        }

        function addToCart() {
            if(!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === currentProduct.id);
            const firstImage = productImages.length > 0 ? productImages[0] : '';

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ 
                    id: currentProduct.id, 
                    title: currentProduct.title, 
                    price: (currentProduct.is_discounted && currentProduct.discount_price !== null) ? currentProduct.discount_price : currentProduct.price, 
                    image: firstImage,
                    quantity: 1,
                    slug: currentProduct.slug
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast('Dodano produkt do koszyka!');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
            updateCartBadge();
        });
    </script>
</body>
</html>
