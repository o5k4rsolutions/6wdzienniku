<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt - 6 w Dzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brandPurple: '#5B21B6', brandPink: '#EC4899' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#FAFAFC] text-slate-800 min-h-screen">

    <header class="w-full bg-white border-b border-purple-100">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/sklep" class="text-[#5B21B6] font-bold hover:underline">← Wróć do sklepu</a>
            <a href="/sklep" class="relative text-[#5B21B6] font-bold">
                Koszyk (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12" id="product-container">
        <div class="text-center text-slate-500 animate-pulse">Ładowanie szczegółów produktu...</div>
    </main>

    <script>
        const SUPABASE_URL = 'https://kzdovdyzqvbuiqnorati.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6ZG92ZHl6cXZidWlxbm9yYXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDQwMjYsImV4cCI6MjEwNTk4MDAyNn0.4gbSDcQhl8KsJmPmuyjtaf2vg8RLsxWyOO7IzjkzzW8';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = JSON.parse(localStorage.getItem('6w_cart')) || [];
        document.getElementById('cart-count').innerText = cart.length;
        let currentProduct = null;

        async function fetchProduct() {
            const pathParts = window.location.pathname.split('/');
            const productId = pathParts[2];

            if (!productId) {
                document.getElementById('product-container').innerHTML = '<p class="text-red-500">Nie znaleziono produktu.</p>';
                return;
            }

            const { data, error } = await supabase.from('products').select('*').eq('id', productId).single();

            if (error || !data) {
                document.getElementById('product-container').innerHTML = '<p class="text-red-500">Błąd lub produkt nie istnieje.</p>';
                return;
            }

            currentProduct = data;
            renderProduct();
        }

        function renderProduct() {
            const container = document.getElementById('product-container');
            const img = currentProduct.images && currentProduct.images.length > 0 ? currentProduct.images[0] : 'https://via.placeholder.com/600x400';
            
            const priceHTML = currentProduct.discount_price 
                ? `<p class="text-slate-400 line-through text-lg">${currentProduct.price} PLN</p>
                   <p class="text-4xl font-extrabold text-[#5B21B6]">${currentProduct.discount_price} PLN</p>`
                : `<p class="text-4xl font-extrabold text-[#5B21B6]">${currentProduct.price} PLN</p>`;

            const omnibusHTML = currentProduct.old_price_30_days 
                ? `<p class="text-xs text-slate-400 mt-2">Najniższa cena z ostatnich 30 dni: ${currentProduct.old_price_30_days} PLN</p>` 
                : '';

            document.title = `${currentProduct.title} - 6 w Dzienniku`;

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-12 bg-white p-8 rounded-3xl shadow-sm border border-purple-100">
                    <div class="rounded-2xl overflow-hidden bg-slate-100">
                        <img src="${img}" alt="${currentProduct.title}" class="w-full h-auto object-cover">
                    </div>
                    <div class="flex flex-col justify-center">
                        <h1 class="text-3xl font-extrabold text-slate-900 mb-4">${currentProduct.title}</h1>
                        <p class="text-slate-600 mb-8 leading-relaxed">${currentProduct.description || 'Brak opisu produktu.'}</p>
                        
                        <div class="mb-8">
                            ${priceHTML}
                            ${omnibusHTML}
                        </div>

                        <button onclick="addToCart()" class="w-full bg-gradient-to-r from-[#5B21B6] to-[#EC4899] text-white font-bold py-4 rounded-xl shadow-md hover:scale-105 transition-transform">
                            Dodaj do koszyka
                        </button>
                    </div>
                </div>
            `;
        }

        function addToCart() {
            if (currentProduct) {
                cart.push(currentProduct.id);
                localStorage.setItem('6w_cart', JSON.stringify(cart));
                document.getElementById('cart-count').innerText = cart.length;
                alert('Dodano do koszyka!');
                window.location.href = '/sklep'; 
            }
        }

        window.onload = fetchProduct;
    </script>
</body>
</html>
