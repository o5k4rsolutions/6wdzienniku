<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nie znaleziono strony | 6WDzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="https://6wdzienniku.vercel.app/6-content/logo_favicon_6.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandViolet: '#5B21B6',
                        brandPink: '#EC4899',
                    },
                    fontFamily: {
                        sans: ['"Open Sans"', 'sans-serif'],
                        condensed: ['"Open Sans Condensed"', 'sans-serif'],
                    },
                    borderRadius: {
                        'custom': '10px',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #FAFAFC;
            color: #1F2937;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-condensed {
            font-family: 'Open Sans Condensed', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-sweep {
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: -101%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #5B21B6 0%, #EC4899 100%);
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            border-radius: inherit;
        }

        .btn-sweep:hover {
            transform: scale(1.04);
            color: #ffffff !important;
            border-color: transparent !important;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.3);
        }

        .btn-sweep:hover::before {
            left: 0;
        }

        .btn-sweep:hover svg,
        .btn-sweep:hover path {
            stroke: #ffffff !important;
            fill: #ffffff !important;
            transition: all 0.3s ease;
        }

        .btn-sweep:hover span {
            color: #ffffff !important;
            transition: color 0.3s ease;
        }

        .text-gradient {
            background: linear-gradient(135deg, #5B21B6 0%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row items-center justify-between gap-4">

            <div class="flex items-center justify-center md:justify-start w-full md:w-auto">
                <a href="https://6wdzienniku.vercel.app" class="inline-block transition-transform duration-300 hover:scale-105">
                    <img src="https://6wdzienniku.vercel.app/6-content/logo_6wdzienn_kolor.png" 
                         alt="6 w dzienniku Logo" 
                         class="h-16 sm:h-20 object-contain mx-auto">
                </a>
            </div>

            <div class="flex items-center justify-center md:justify-end w-full md:w-auto">
                <div class="btn-sweep px-4 py-2 border border-purple-200 text-brandViolet rounded-custom shadow-sm bg-white cursor-default select-none flex items-center space-x-2">
                    <svg class="w-5 h-5 text-brandPink transition-colors shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <span class="text-base font-bold font-condensed tracking-wider text-gradient transition-colors">404</span>
                </div>
            </div>

        </div>
    </header>

    <main class="flex-grow">
        <section class="bg-gradient-to-r from-gray-100 via-gray-50 to-purple-50 py-16 md:py-28 border-b border-gray-200 relative overflow-hidden reveal active">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">

                <div class="md:col-span-7 space-y-6 text-center md:text-left">
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl text-gray-950 tracking-tight leading-none font-condensed">
                        UPS! STRONA, KTÓREJ SZUKASZ, <span class="text-gradient">NIE ISTNIEJE</span>.
                    </h1>

                    <p class="text-gray-600 text-base sm:text-lg max-w-xl mx-auto md:mx-0 leading-relaxed font-sans">
                        Wygląda na to, że ten link jest błędny lub strona została przeniesiona. Wróć na stronę główną, aby kontynuować drogę po same <span class="text-gradient">szóstki</span>.
                    </p>

                    <div class="flex flex-col sm:flex-row items-center justify-center md:justify-start gap-4 pt-2">
                        <a href="https://6wdzienniku.vercel.app" 
                           class="btn-sweep w-full sm:w-auto px-8 py-3.5 bg-white border-2 border-brandViolet text-brandViolet font-bold text-base rounded-custom shadow-md">
                           <span>Powróć do strony głównej</span>
                           <svg class="w-4 h-4 ml-2 stroke-brandViolet" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                           </svg>
                        </a>
                    </div>
                </div>

                <div class="md:col-span-5 flex justify-center items-center">
                    <div class="relative w-full max-w-md bg-white p-8 sm:p-10 rounded-custom shadow-xl border border-purple-100 transform md:rotate-1 hover:rotate-0 transition duration-500 text-center flex flex-col items-center justify-center">
                        
                        <div class="relative mb-6">
                            <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-brandViolet to-brandPink opacity-20 blur-lg"></div>
                            <div class="relative w-32 h-32 sm:w-40 sm:h-40 bg-purple-50 rounded-full flex items-center justify-center border-4 border-white shadow-inner mx-auto">
                                <svg class="w-20 h-20 text-brandViolet" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-6xl font-black text-gradient font-condensed tracking-wider mb-2">404</div>
                        <h3 class="text-xl font-bold font-condensed text-gray-900 mb-1">Strona nie znaleziona</h3>
                    </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4 space-y-1">
            <p>© 2026 <b>6WDzienniku</b></p>
            <p>Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script>
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal');
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                const elementVisible = 80;

                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add('active');
                }
            }
        }

        window.addEventListener('scroll', revealOnScroll);
        revealOnScroll();
    </script>
</body>
</html>
