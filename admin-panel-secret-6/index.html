<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admina - 6 w Dzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-8 font-sans min-h-screen">

    <!-- Kontener Główny -->
    <div id="admin-content" class="max-w-6xl mx-auto bg-white p-8 rounded-3xl shadow-lg hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-purple-900">Panel Administratora</h1>
            <button onclick="logout()" class="bg-red-500 text-white text-xs px-4 py-2 rounded-xl font-bold">Wyloguj</button>
        </div>

        <section class="mb-12 border-b pb-8">
            <h2 class="text-xl font-bold mb-4">Dodaj / Edytuj Produkt</h2>
            <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-title" placeholder="Tytuł produktu" class="border p-3 rounded-xl" required>
                <select id="p-type" class="border p-3 rounded-xl">
                    <option value="digital">Produkt Cyfrowy (E-produkt)</option>
                    <option value="physical">Produkt Fizyczny</option>
                </select>
                <input type="number" step="0.01" id="p-price" placeholder="Cena PLN" class="border p-3 rounded-xl" required>
                <input type="number" step="0.01" id="p-old-price" placeholder="Cena sprzed 30 dni" class="border p-3 rounded-xl">
                <textarea id="p-desc" placeholder="Opis produktu" class="border p-3 rounded-xl md:col-span-2"></textarea>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold mb-1">Zdjęcia produktu:</label>
                    <input type="file" id="p-images" multiple class="border p-2 rounded-xl w-full">
                </div>

                <div class="md:col-span-2 bg-purple-50 p-4 rounded-xl space-y-3">
                    <label class="block text-xs font-bold text-purple-900">E-produkt: Załącz pliki lub cały folder:</label>
                    <div>
                        <span class="text-xs text-slate-500 block mb-1">Pojedynczy plik:</span>
                        <input type="file" id="p-file" class="border p-2 rounded-xl w-full bg-white">
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 block mb-1">Lub prześlij cały folder:</span>
                        <input type="file" id="p-folder" webkitdirectory directory multiple class="border p-2 rounded-xl w-full bg-white">
                    </div>
                </div>

                <button type="button" id="submit-btn" onclick="saveProduct()" class="md:col-span-2 bg-[#5B21B6] text-white py-3 rounded-xl font-bold hover:bg-[#4c1d95] transition">Zapisz i opublikuj produkt</button>
            </form>
        </section>

        <section class="mb-12 border-b pb-8">
            <h2 class="text-xl font-bold mb-4">Dodaj Kod Rabatowy</h2>
            <form id="coupon-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="c-code" placeholder="Kod (np. PROMO10)" class="border p-3 rounded-xl uppercase">
                <select id="c-type" class="border p-3 rounded-xl">
                    <option value="percent">Procent obniżki (%)</option>
                    <option value="fixed">Kwota obniżki (PLN)</option>
                </select>
                <input type="number" id="c-val" placeholder="Wartość" class="border p-3 rounded-xl">
                <input type="number" id="c-min" placeholder="Min. cena zamówienia" class="border p-3 rounded-xl">
                <input type="datetime-local" id="c-date" class="border p-3 rounded-xl">
                <button type="button" onclick="saveCoupon()" class="bg-[#EC4899] text-white py-3 rounded-xl font-bold hover:bg-pink-600 transition">Dodaj kod</button>
            </form>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-4">Opinie do zatwierdzenia</h2>
            <div id="admin-reviews" class="space-y-4"></div>
        </section>
    </div>

    <!-- Pasek ładowania / Weryfikacja -->
    <div id="loading-spinner" class="text-center py-20 font-bold text-slate-500">
        Weryfikacja uprawnień administratora...
    </div>

    <script>
        const SUPABASE_URL = "https://aouuylcmewkowgpijuci.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdXV5bGNtZXdrb3dncGlqdWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTM3NDcsImV4cCI6MjEwNTkyOTc0N30.IFGjFzXYzJyN8QjKAs1Zoslyx7Nv3xFFv7SND7xsE0g";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Funkcja automatycznie czyszcząca polskie znaki i znaki specjalne ze ścieżki
        function cleanPath(path) {
            return path
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // Usuwa ogonki (ą->a, ę->e, ó->o itp.)
                .replace(/Ł/g, "L").replace(/ł/g, "l")
                .replace(/\s+/g, "_")            // Spacje na podkreślniki _
                .replace(/[^a-zA-Z0-9_\-\.\/]/g, ""); // Usuwa pozostałe znaki niedozwolone przez Supabase
        }

        // Weryfikacja konta admina
        async function checkAdminAccess() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                alert("Dostęp zabroniony. Zaloguj się na konto administratora.");
                window.location.href = "https://6wdzienniku.vercel.app/mojekonto";
                return;
            }

            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (!profile || profile.role !== 'admin') {
                alert("Brak uprawnień administratora!");
                window.location.href = "https://6wdzienniku.vercel.app";
                return;
            }

            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('admin-content').classList.remove('hidden');

            loadPendingReviews();
        }

        // Zapis produktu z automatyczną konwersją nazw plików/folderów
        async function saveProduct() {
            const btn = document.getElementById('submit-btn');
            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const oldPrice = parseFloat(document.getElementById('p-old-price').value) || null;
            const type = document.getElementById('p-type').value;
            const desc = document.getElementById('p-desc').value;
            const slug = cleanPath(title.toLowerCase());

            if (!title || isNaN(price)) {
                alert("Podaj tytuł i cenę produktu.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Trwa przesyłanie plików...";

            try {
                // Upload Zdjęć
                const imageFiles = document.getElementById('p-images').files;
                let imageUrls = [];
                for (let f of imageFiles) {
                    const cleanedName = cleanPath(f.name);
                    const { data } = await supabaseClient.storage.from('moje-pliki').upload(`produkty/${slug}/${cleanedName}`, f);
                    if (data) imageUrls.push(supabaseClient.storage.from('moje-pliki').getPublicUrl(data.path).data.publicUrl);
                }

                // Upload Pojedynczego Pliku lub Folderu
                const singleFile = document.getElementById('p-file').files[0];
                const folderFiles = document.getElementById('p-folder').files;

                let digitalUrl = null, fileType = null;

                if (folderFiles.length > 0) {
                    fileType = 'folder';
                    
                    for (let f of folderFiles) {
                        const rawPath = f.webkitRelativePath || f.name;
                        const cleanedPath = cleanPath(rawPath);

                        const { data, error } = await supabaseClient.storage
                            .from('moje-pliki')
                            .upload(`produkty/${slug}/content/${cleanedPath}`, f);

                        if (error) {
                            console.error("Błąd pliku:", cleanedPath, error.message);
                        } else if (!digitalUrl) {
                            digitalUrl = supabaseClient.storage
                                .from('moje-pliki')
                                .getPublicUrl(`produkty/${slug}/content`).data.publicUrl;
                        }
                    }
                } else if (singleFile) {
                    const cleanedName = cleanPath(singleFile.name);
                    const { data } = await supabaseClient.storage
                        .from('moje-pliki')
                        .upload(`produkty/${slug}/content/${cleanedName}`, singleFile);
                    
                    if (data) {
                        digitalUrl = supabaseClient.storage.from('moje-pliki').getPublicUrl(data.path).data.publicUrl;
                        fileType = singleFile.name.split('.').pop();
                    }
                }

                // Zapis do bazy
                const { error } = await supabaseClient.from('products').insert({
                    title, slug, price, old_price_30_days: oldPrice, type, description: desc,
                    images: imageUrls, file_url: digitalUrl, file_type: fileType
                });

                if (error) {
                    alert("Błąd bazy danych: " + error.message);
                } else {
                    alert("Produkt został pomyślnie opublikowany!");
                    location.reload();
                }
            } catch (err) {
                alert("Wystąpił błąd: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Zapisz i opublikuj produkt";
            }
        }

        // Kody rabatowe
        async function saveCoupon() {
            const code = document.getElementById('c-code').value.trim();
            const val = parseFloat(document.getElementById('c-val').value);

            if (!code || isNaN(val)) return alert("Podaj kod i jego wartość.");

            const { error } = await supabaseClient.from('coupons').insert({
                code: code.toUpperCase(),
                discount_type: document.getElementById('c-type').value,
                discount_value: val,
                min_price: parseFloat(document.getElementById('c-min').value) || 0,
                valid_until: document.getElementById('c-date').value || null
            });

            if (error) alert("Błąd: " + error.message);
            else alert("Kod rabatowy został dodany!");
        }

        // Opinie
        async function loadPendingReviews() {
            const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('is_approved', false);
            const container = document.getElementById('admin-reviews');

            if (!reviews || reviews.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Brak opinii oczekujących na zatwierdzenie.</p>`;
                return;
            }

            container.innerHTML = reviews.map(r => `
                <div class="border p-4 rounded-xl flex justify-between items-center bg-white">
                    <div>
                        <p class="font-bold">${r.user_name} (Ocena: ${r.rating}/5)</p>
                        <p class="text-sm text-slate-600">${r.comment}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="approveReview('${r.id}')" class="bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-bold">Zatwierdź</button>
                        <button onclick="deleteReview('${r.id}')" class="bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-bold">Usuń</button>
                    </div>
                </div>
            `).join('');
        }

        async function approveReview(id) {
            await supabaseClient.from('reviews').update({ is_approved: true }).eq('id', id);
            loadPendingReviews();
        }

        async function deleteReview(id) {
            await supabaseClient.from('reviews').delete().eq('id', id);
            loadPendingReviews();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "https://6wdzienniku.vercel.app";
        }

        checkAdminAccess();
    </script>
</body>
</html>
