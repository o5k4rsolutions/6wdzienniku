<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - 6 w Dzienniku</title>
    <link rel="icon" type="image/x-icon" href="https://6wdzienniku.vercel.app/6-content/logo_favicon_6.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brandPurple: '#5B21B6', brandPink: '#EC4899', brandLight: '#FDF4FF' } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .sweep-btn { position: relative; overflow: hidden; z-index: 1; transition: transform 0.3s, box-shadow 0.3s; }
        .sweep-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(135deg, #5B21B6 0%, #EC4899 100%);
            transition: transform 0.4s; z-index: -1;
        }
        .sweep-btn:hover::before { transform: translateX(100%); }
        .sweep-btn:hover { transform: scale(1.05); box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4); }
    </style>
</head>
<body class="bg-[#FAFAFC] text-slate-800 min-h-screen flex flex-col relative">

    <header class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-purple-100">
        <div class="max-w-6xl mx-auto px-6 h-24 flex items-center justify-between">
            <a href="https://6wdzienniku.vercel.app" class="flex items-center group">
                <img src="https://6wdzienniku.vercel.app/6-content/logo_6wdzienn_kolor.png" class="h-16 transition-transform group-hover:scale-105" alt="Logo">
            </a>
            <nav class="flex items-center gap-4">
                <button onclick="toggleCart()" class="p-2 text-[#5B21B6] hover:text-[#EC4899] transition-colors relative" title="Koszyk">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <span id="cart-count" class="absolute top-0 right-0 bg-[#EC4899] text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">0</span>
                </button>
                <button onclick="checkAuthAndToggleModal()" class="p-2 text-[#5B21B6] hover:text-[#EC4899] transition-colors" title="Moje Konto">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
        <div class="mb-10 text-center sm:text-left">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-2">Nasze Produkty</h1>
            <p class="text-slate-500">Wybierz materiały, które pomogą Ci osiągnąć najlepsze wyniki.</p>
        </div>
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
            <div class="col-span-full text-center text-slate-500">Ładowanie produktów...</div>
        </div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl relative transform scale-95 transition-transform duration-300" id="auth-modal-content">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-xl border border-red-100"></div>

            <div id="login-form">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Zaloguj się</h2>
                <input type="email" id="login-email" placeholder="Adres e-mail" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-4 focus:outline-none focus:border-[#5B21B6]">
                <input type="password" id="login-pass" placeholder="Hasło" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-2 focus:outline-none focus:border-[#5B21B6]">
                <button class="text-sm text-[#5B21B6] hover:underline mb-6 block w-full text-right" onclick="switchAuthView('reset')">Zapomniałeś hasła?</button>
                <button onclick="handleLogin()" class="sweep-btn w-full bg-gradient-to-r from-[#5B21B6] to-[#EC4899] text-white font-bold py-3.5 rounded-xl shadow-md mb-4">Zaloguj się</button>
                <p class="text-center text-sm text-slate-500">Nie masz konta? <button onclick="switchAuthView('register')" class="text-[#5B21B6] font-semibold hover:underline">Zarejestruj się</button></p>
            </div>

            <div id="register-form" class="hidden">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Rejestracja</h2>
                <input type="text" id="register-name" placeholder="Imię i Nazwisko" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-4 focus:outline-none focus:border-[#5B21B6]">
                <input type="email" id="register-email" placeholder="Adres e-mail" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-4 focus:outline-none focus:border-[#5B21B6]">
                <input type="password" id="register-pass" placeholder="Hasło" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-6 focus:outline-none focus:border-[#5B21B6]">
                <button onclick="handleRegister()" class="sweep-btn w-full bg-gradient-to-r from-[#5B21B6] to-[#EC4899] text-white font-bold py-3.5 rounded-xl shadow-md mb-4">Załóż konto</button>
                <p class="text-center text-sm text-slate-500">Masz już konto? <button onclick="switchAuthView('login')" class="text-[#5B21B6] font-semibold hover:underline">Zaloguj się</button></p>
            </div>

            <div id="reset-form" class="hidden">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Reset hasła</h2>
                <p class="text-sm text-slate-500 mb-6">Podaj e-mail. Wyślemy Ci link do zmiany hasła.</p>
                <input type="email" id="reset-email" placeholder="Adres e-mail" class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-6 focus:outline-none focus:border-[#5B21B6]">
                <button onclick="handleReset()" class="sweep-btn w-full bg-gradient-to-r from-[#5B21B6] to-[#EC4899] text-white font-bold py-3.5 rounded-xl shadow-md mb-4">Wyślij link</button>
                <p class="text-center text-sm text-slate-500"><button onclick="switchAuthView('login')" class="text-[#5B21B6] font-semibold hover:underline">Wróć do logowania</button></p>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white p-6 sm:p-8 rounded-3xl w-full max-w-lg shadow-2xl relative max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-300" id="cart-modal-content">
            <button onclick="toggleCart()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Twój Koszyk</h2>
            <div id="cart-items" class="mb-6 space-y-4"></div>

            <div class="flex justify-between items-center mb-6 pt-4 border-t border-slate-100">
                <span class="text-slate-500 font-medium">Suma do zapłaty:</span>
                <span id="cart-total" class="text-2xl font-extrabold text-[#5B21B6]">0,00 PLN</span>
            </div>

            <form id="payment-form">
                <div id="payment-element" class="mb-6 min-h-[150px] bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center justify-center text-sm text-slate-500">
                    Ładowanie połączenia płatności...
                </div>
                <div id="payment-error" class="hidden text-red-500 text-sm mb-4"></div>
                <button id="submit-payment" type="submit" disabled class="sweep-btn w-full bg-gradient-to-r from-[#5B21B6] to-[#EC4899] text-white font-bold py-4 rounded-xl shadow-md disabled:opacity-50">
                    Zapłać i Zamów
                </button>
            </form>
        </div>
    </div>

    <script>
        const STRIPE_PUBLISHABLE_KEY = 'pk_live_51U9Lv5Q2ih8UDd9IQJ2lVSHCayHb6qrJUN1y8i3za2f6GZNA0sv4H5tBsFcdbyZAOHL3nvJvQCCA76XYtvBow0kL00yLvmCiTI'; 
        const SUPABASE_URL = 'https://kzdovdyzqvbuiqnorati.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6ZG92ZHl6cXZidWlxbm9yYXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDQwMjYsImV4cCI6MjEwNTk4MDAyNn0.4gbSDcQhl8KsJmPmuyjtaf2vg8RLsxWyOO7IzjkzzW8';
        
        const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let cart = JSON.parse(localStorage.getItem('6w_cart')) || [];
        let allProducts = [];
        let stripeElements;

        async function fetchProducts() {
            const { data, error } = await supabase.from('products').select('*');
            if (error) {
                document.getElementById('product-list').innerHTML = '<div class="col-span-full text-red-500">Błąd ładowania produktów.</div>';
                return;
            }
            allProducts = data;
            renderProducts();
            updateCartCount();
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            allProducts.forEach(p => {
                const img = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/400x300';
                const priceHTML = p.discount_price 
                    ? `<p class="text-slate-400 line-through text-sm">${p.price} PLN</p><p class="text-2xl font-extrabold text-[#5B21B6]">${p.discount_price} PLN</p>`
                    : `<p class="text-2xl font-extrabold text-[#5B21B6]">${p.price} PLN</p>`;
                
                const omnibusHTML = p.old_price_30_days 
                    ? `<p class="text-[11px] text-slate-400 mt-2">Najniższa cena z 30 dni: ${p.old_price_30_days} PLN</p>` : '';

                list.innerHTML += `
                    <div class="bg-white rounded-2xl border border-purple-100 p-5 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group cursor-pointer" onclick="window.location.href='/produkty/${p.id}/${p.slug}'">
                        <div class="w-full h-48 bg-slate-100 rounded-xl mb-4 overflow-hidden relative">
                            <img src="${img}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        </div>
                        <h2 class="text-lg font-bold text-slate-900 mb-1 leading-tight">${p.title}</h2>
                        <div class="mt-auto pt-4 border-t border-slate-100">
                            <div class="flex items-end justify-between mb-1">
                                <div>${priceHTML}</div>
                                <button onclick="event.stopPropagation(); addToCart('${p.id}')" class="bg-slate-100 hover:bg-[#5B21B6] text-[#5B21B6] hover:text-white p-3 rounded-xl transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            </div>
                            ${omnibusHTML}
                        </div>
                    </div>`;
            });
        }

        async function checkAuthAndToggleModal() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = '/mojekonto';
            } else {
                toggleAuthModal();
            }
        }

        function showAuthError(msg) {
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = msg;
            errDiv.classList.remove('hidden');
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) showAuthError("Nieprawidłowy e-mail lub hasło.");
            else window.location.href = '/mojekonto';
        }

        async function handleRegister() {
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-pass').value;
            
            const { data, error } = await supabase.auth.signUp({ 
                email, password, 
                options: { data: { first_name: name } }
            });
            
            if (error) showAuthError(error.message);
            else {
                alert("Konto założone! Możesz się teraz zalogować.");
                switchAuthView('login');
            }
        }

        async function handleReset() {
            const email = document.getElementById('reset-email').value;
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://6wdzienniku.vercel.app/sklep?reset=true',
            });
            if (error) showAuthError(error.message);
            else {
                alert("Link do resetu hasła został wysłany na Twój e-mail.");
                switchAuthView('login');
            }
        }

        function addToCart(productId) {
            cart.push(productId);
            localStorage.setItem('6w_cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        async function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden'); modal.style.display = 'flex';
                setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
                
                renderCartItems();
                
                if(cart.length > 0) {
                    try {
                        const response = await fetch('/api/create-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ productIds: cart })
                        });
                        const { clientSecret } = await response.json();
                        
                        stripeElements = stripe.elements({ clientSecret, appearance: { theme: 'stripe' } });
                        const paymentElement = stripeElements.create('payment');
                        document.getElementById('payment-element').innerHTML = '';
                        paymentElement.mount('#payment-element');
                        document.getElementById('submit-payment').disabled = false;
                        
                    } catch (err) {
                        document.getElementById('payment-element').innerHTML = 'Błąd połączenia z operatorem płatności.';
                    }
                } else {
                    document.getElementById('payment-element').innerHTML = 'Koszyk jest pusty.';
                    document.getElementById('submit-payment').disabled = true;
                }
            } else {
                modal.classList.add('opacity-0'); content.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); modal.style.display = 'none'; }, 300);
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            
            cart.forEach((id, index) => {
                const product = allProducts.find(p => p.id === id);
                if(product) {
                    const price = product.discount_price || product.price;
                    total += price;
                    container.innerHTML += `
                        <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                            <div><p class="font-semibold text-slate-800 text-sm">${product.title}</p>
                            <p class="text-[#5B21B6] font-bold">${price} PLN</p></div>
                            <button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-red-500">Usuń</button>
                        </div>`;
                }
            });
            document.getElementById('cart-total').innerText = total.toFixed(2) + ' PLN';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('6w_cart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
        }

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-payment');
            btn.disabled = true;
            btn.innerText = "Przetwarzanie...";

            const { error } = await stripe.confirmPayment({
                elements: stripeElements,
                confirmParams: {
                    return_url: 'https://6wdzienniku.vercel.app/mojekonto',
                },
            });

            if (error) {
                const errDiv = document.getElementById('payment-error');
                errDiv.innerText = error.message;
                errDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Zapłać i Zamów";
            }
        });

        function toggleAuthModal() {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('auth-modal-content');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden'); modal.style.display = 'flex';
                setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
            } else {
                modal.classList.add('opacity-0'); content.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); modal.style.display = 'none'; }, 300);
            }
        }

        function switchAuthView(view) {
            document.getElementById('auth-error').classList.add('hidden');
            ['login', 'register', 'reset'].forEach(v => {
                document.getElementById(`${v}-form`).classList.add('hidden');
            });
            document.getElementById(`${view}-form`).classList.remove('hidden');
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
