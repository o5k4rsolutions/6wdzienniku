<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - 6WDzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="https://6wdzienniku.vercel.app/6-content/logo_favicon_6.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:ital,wght@0,300;0,700;1,300&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandViolet: '#5B21B6', brandPink: '#EC4899' },
                    fontFamily: { sans: ['"Open Sans"', 'sans-serif'], condensed: ['"Open Sans Condensed"', 'sans-serif'] },
                    borderRadius: { 'custom': '10px' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #FAFAFC; color: #1F2937; }
        h1, h2, h3, .font-condensed { font-family: 'Open Sans Condensed', sans-serif; font-weight: 700; text-transform: uppercase; }
        .text-gradient { background: linear-gradient(135deg, #5B21B6 0%, #EC4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-sweep {
            position: relative; z-index: 1; overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease, border-color 0.3s ease;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-sweep::before {
            content: ''; position: absolute; top: 0; left: -101%; width: 100%; height: 100%;
            background: linear-gradient(135deg, #5B21B6 0%, #EC4899 100%); transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: -1;
        }
        .btn-sweep:hover { transform: scale(1.04); color: #ffffff !important; border-color: transparent !important; }
        .btn-sweep:hover::before { left: 0; }
        .btn-sweep:hover svg { stroke: #ffffff !important; fill: #ffffff !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out bg-gray-900 text-white px-5 py-3 rounded-custom shadow-xl border border-purple-500/30 flex items-center gap-3">
        <span id="toast-message" class="text-sm font-medium">Powiadomienie</span>
    </div>

    <header class="w-full bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
            <a href="https://6wdzienniku.vercel.app/" class="inline-block transition-transform duration-300 hover:scale-105">
                <img src="https://6wdzienniku.vercel.app/6-content/logo_6wdzienn_kolor.png" alt="6 w dzienniku Logo" class="h-16 sm:h-20 object-contain">
            </a>

            <div class="flex items-center gap-3">
                <a href="/api-login/?login" class="p-2.5 rounded-custom border border-brandViolet text-brandViolet hover:bg-purple-50 transition" title="Logowanie">
                    <svg class="w-5 h-5 stroke-brandViolet" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </a>

                <a href="/koszyk" class="p-2.5 rounded-custom border border-brandPink text-brandPink hover:bg-pink-50 transition relative" title="Koszyk">
                    <svg class="w-5 h-5 stroke-brandPink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-brandPink text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-condensed text-gray-900 tracking-tight">Sklep z <span class="text-gradient">materiałamii</span></h1>
            <p class="text-gray-600 text-sm sm:text-base mt-2 max-w-xl mx-auto">Wybierz testy, kartkówki i sprawdziany, które pomogą Ci osiągnąć najlepsze wyniki.</p>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400 font-sans">Ładowanie produktów...</div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4 space-y-1">
            <p>© 2026 <b>6WDzienniku</b></p>
            <p>Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://fxksikgdberwgttvglko.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4a3Npa2dkYmVyd2d0dHZnbGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzU3NzYsImV4cCI6MjEwNjAxMTc3Nn0.sKf3vvVbaae5-mdg5zwqrgUl6AkXjENanwhDWbH_PXw";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((acc, item) => acc + item.quantity, 0);
            if(totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: product.is_discounted ? product.discount_price : product.price,
                    image: product.images[0] || 'https://via.placeholder.com/300',
                    quantity: 1,
                    slug: product.slug
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`Dodano do koszyka: ${product.title}`);
        }

        async function loadProducts() {
            const { data: products, error } = await supabase.from('products').select('*');
            const grid = document.getElementById('products-grid');

            if (error || !products || products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 font-sans">Brak produktów do wyświetlenia.</div>';
                return;
            }

            grid.innerHTML = products.map(product => {
                const currentPrice = product.is_discounted ? product.discount_price : product.price;
                const firstImage = product.images[0] || 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=600&q=80';
                const productUrl = `/produkty/${product.id}/${product.slug}`;

                return `
                    <div class="bg-white rounded-custom border border-gray-100 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <a href="${productUrl}">
                            <img src="${firstImage}" alt="${product.title}" class="w-full h-48 object-cover">
                        </a>
                        <div class="p-5 flex-grow flex flex-col justify-between">
                            <div>
                                <a href="${productUrl}">
                                    <h3 class="text-xl font-condensed text-gray-900 hover:text-brandViolet transition">${product.title}</h3>
                                </a>
                                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${product.description || ''}</p>
                            </div>

                            <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                                <div>
                                    <span class="text-xl font-bold font-condensed text-brandViolet">${parseFloat(currentPrice).toFixed(2)} PLN</span>
                                    ${product.is_discounted ? `<span class="text-xs text-gray-400 line-through ml-1.5">${parseFloat(product.price).toFixed(2)} PLN</span>` : ''}
                                </div>

                                <button onclick='addToCart(${JSON.stringify(product).replace(/'/g, "&apos;")})' class="btn-sweep px-3.5 py-2 border border-brandPink text-brandPink font-semibold rounded-custom text-xs bg-white">
                                    <svg class="w-4 h-4 stroke-brandPink mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                                    </svg>
                                    <span>Do koszyka</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            updateCartBadge();
        });
    </script>
</body>
</html>
