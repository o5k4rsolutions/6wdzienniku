<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - Koszyk i Płatność</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Stripe JS SDK -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-gray-900">Mój Sklep</h1>
            <div id="user-status" class="text-sm font-medium text-gray-600">
                Ładowanie profilu...
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Kolumna produktów w koszyku (Lewa strona) -->
        <section class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Twój Koszyk</h2>
                <div id="cart-items-container" class="space-y-4 mb-6">
                    <!-- Dynamiczne elementy koszyka -->
                    <p class="text-gray-500 font-sans">Ładowanie koszyka...</p>
                </div>
            </div>

            <!-- Sekcja Kuponów -->
            <div class="mt-4 pt-4 border-t border-gray-100">
                <div id="coupon-input-container" class="flex gap-2">
                    <input type="text" id="coupon-code" placeholder="Kod rabatowy" class="flex-grow px-4 py-2 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    <button onclick="applyCoupon()" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-800 transition">Zastosuj</button>
                </div>
                <div id="coupon-applied-badge" class="hidden flex justify-between items-center bg-green-50 border border-green-200 p-3 rounded-xl">
                    <span class="text-xs text-green-700 font-medium" id="applied-coupon-text">Kupon aktywny</span>
                    <button onclick="removeCoupon()" class="text-xs text-red-600 font-medium hover:underline">Usuń</button>
                </div>
            </div>
        </section>

        <!-- Kolumna Podsumowania i Płatności (Prawa strona) -->
        <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-gray-900 mb-4 pb-2 border-b border-gray-100">Podsumowanie</h2>
                
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between text-gray-600">
                        <span>Wartość produktów:</span>
                        <span id="subtotal-val" class="font-medium text-gray-900">0.00 PLN</span>
                    </div>
                    <div id="discount-row" class="flex justify-between text-green-600 hidden">
                        <span>Rabat:</span>
                        <span id="discount-val">-0.00 PLN</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold text-gray-900 pt-3 border-t border-gray-100">
                        <span>Do zapłaty:</span>
                        <span id="total-val">0.00 PLN</span>
                    </div>
                </div>
            </div>

            <!-- Stan niezalogowany -->
            <div id="auth-section" class="hidden mt-8 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-center">
                <p class="text-sm text-yellow-800 mb-3 font-medium">Musisz być zalogowany, aby przejść do płatności.</p>
                <a href="/login.html" class="inline-block bg-yellow-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-yellow-700 transition">Zaloguj się</a>
            </div>

            <!-- Stan koszyk pusty lub gotowy do płatności -->
            <div id="checkout-section" class="mt-8">
                <!-- Stripe Payment Element Form Container -->
                <form id="payment-form" class="hidden space-y-4">
                    <div id="payment-element">
                        <!-- Stripe Element injects here -->
                    </div>
                    <button id="submit-btn" class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition flex justify-center items-center">
                        <span id="button-text">Zapłać teraz</span>
                    </button>
                    <div id="payment-message" class="text-xs text-red-600 text-center hidden"></div>
                </form>

                <div id="empty-cart-msg" class="text-center text-sm text-gray-400 py-4">
                    Dodaj produkty do koszyka, aby odblokować płatność.
                </div>
            </div>
        </section>

    </main>

    <!-- Skrypt logiki aplikacji koszyka i Stripe -->
    <script>
        // Inicjalizacja Stripe (klucz publiczny testowy/produkcyjny)
        const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx'); 

        // Stan aplikacji w pamięci przeglądarki
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let appliedCouponCode = null;
        let discountPercent = 0;
        let currentTotalValue = 0;
        let elementsInstance = null;
        let paymentIntentClientSecret = null;
        let isFetchingIntent = false;

        // Start aplikacji po załadowaniu DOM
        document.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            await validateAndSyncCart();
            await renderCart();
        });

        // Symulacja sprawdzenia sesji użytkownika
        async function checkUserSession() {
            const userStatusEl = document.getElementById('user-status');
            const authSection = document.getElementById('auth-section');
            const checkoutSection = document.getElementById('checkout-section');

            // Przykład: pobranie informacji o zalogowanym użytkowniku z backendu / Supabase
            try {
                const response = await fetch('/api/user-session');
                const data = await response.json();

                if (data && data.loggedIn) {
                    userStatusEl.innerText = `Witaj, ${data.email}`;
                    authSection.classList.add('hidden');
                    initCheckout();
                } else {
                    userStatusEl.innerText = 'Niezalogowany';
                    authSection.classList.remove('hidden');
                    document.getElementById('payment-form').classList.add('hidden');
                    document.getElementById('empty-cart-msg').classList.add('hidden');
                }
            } catch (err) {
                // Tryb offline / awaryjny dla celów testowych frontendu
                userStatusEl.innerText = 'Klient (Tryb Lokalny)';
                authSection.classList.add('hidden');
                initCheckout();
            }
        }

        // Walidacja i synchronizacja stanu koszyka (np. ceny z bazą danych)
        async function validateAndSyncCart() {
            if (!cart || cart.length === 0) return;
            try {
                const response = await fetch('/api/validate-cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart })
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.updatedCart) {
                        cart = data.updatedCart;
                        localStorage.setItem('cart', JSON.stringify(cart));
                    }
                }
            } catch (e) {
                console.warn('Nie udało się zsynchronizować koszyka z backendem, używam lokalnych danych.');
            }
        }

        // Renderowanie widoku koszyka i podsumowania finansowego
        async function renderCart() {
            const container = document.getElementById('cart-items-container');
            
            if (!cart || cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 font-sans">Twój koszyk jest pusty.</p>';
                document.getElementById('subtotal-val').innerText = '0.00 PLN';
                document.getElementById('discount-row').classList.add('hidden');
                document.getElementById('total-val').innerText = '0.00 PLN';
                currentTotalValue = 0;

                // Reset kuponu gdy koszyk jest pusty
                appliedCouponCode = null;
                discountPercent = 0;
                document.getElementById('coupon-input-container').classList.remove('hidden');
                document.getElementById('coupon-applied-badge').classList.add('hidden');
                document.getElementById('coupon-code').value = '';

                document.getElementById('payment-form').classList.add('hidden');
                document.getElementById('empty-cart-msg').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-cart-msg').classList.add('hidden');
            document.getElementById('payment-form').classList.remove('hidden');

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 1);
                subtotal += itemTotal;
                html += `
                    <div class="flex justify-between items-center p-3 border border-gray-100 rounded-xl bg-gray-50/50">
                        <div>
                            <h4 class="font-medium text-sm text-gray-900">${item.name || 'Produkt'}</h4>
                            <p class="text-xs text-gray-500">${item.price} PLN x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold text-gray-900">${itemTotal.toFixed(2)} PLN</span>
                            <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-xs font-medium">Usuń</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Obliczenia finansowe z uwzględnieniem kuponu
            document.getElementById('subtotal-val').innerText = `${subtotal.toFixed(2)} PLN`;
            
            let discountAmount = 0;
            if (discountPercent > 0) {
                discountAmount = subtotal * (discountPercent / 100);
                document.getElementById('discount-row').classList.remove('hidden');
                document.getElementById('discount-val').innerText = `-${discountAmount.toFixed(2)} PLN`;
            } else {
                document.getElementById('discount-row').classList.add('hidden');
            }

            currentTotalValue = Math.max(0, subtotal - discountAmount);
            document.getElementById('total-val').innerText = `${currentTotalValue.toFixed(2)} PLN`;

            // Odświeżenie sesji płatniczej Stripe po zmianie wartości koszyka
            await initCheckout();
        }

        // Usunięcie pojedynczego przedmiotu z koszyka
        async function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            await renderCart();
        }

        // Obsługa kuponów rabatowych
        async function applyCoupon() {
            const codeInput = document.getElementById('coupon-code');
            const code = codeInput.value.trim();
            if (!code) return;

            try {
                const response = await fetch('/api/verify-coupon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if (response.ok && data.valid) {
                    appliedCouponCode = code;
                    discountPercent = data.discountPercent; // np. 10 dla 10%
                    
                    document.getElementById('coupon-input-container').classList.add('hidden');
                    document.getElementById('coupon-applied-badge').classList.remove('hidden');
                    document.getElementById('applied-coupon-text').innerText = `Kupon ${code} (-${discountPercent}%)`;
                    
                    await renderCart();
                } else {
                    alert(data.message || 'Niepoprawny kod kuponu.');
                }
            } catch (err) {
                // Tryb demonstracyjny kodu rabatowego
                if (code.toUpperCase() === 'TEST10') {
                    appliedCouponCode = code;
                    discountPercent = 10;
                    document.getElementById('coupon-input-container').classList.add('hidden');
                    document.getElementById('coupon-applied-badge').classList.remove('hidden');
                    document.getElementById('applied-coupon-text').innerText = `Kupon ${code} (-10%)`;
                    await renderCart();
                } else {
                    alert('Błąd weryfikacji kuponu.');
                }
            }
        }

        function removeCoupon() {
            appliedCouponCode = null;
            discountPercent = 0;
            document.getElementById('coupon-input-container').classList.remove('hidden');
            document.getElementById('coupon-applied-badge').classList.add('hidden');
            document.getElementById('coupon-code').value = '';
            renderCart();
        }

        // Inicjalizacja komponentu Stripe Payment Element
        async function initCheckout() {
            if (currentTotalValue <= 0 || isFetchingIntent) return;
            isFetchingIntent = true;

            try {
                const response = await fetch('/api/create-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart, coupon: appliedCouponCode, total: currentTotalValue })
                });

                const data = await response.json();
                if (data.clientSecret) {
                    paymentIntentClientSecret = data.clientSecret;
                    
                    const appearance = { theme: 'stripe' };
                    elementsInstance = stripe.elements({ appearance, clientSecret: paymentIntentClientSecret });
                    
                    const paymentElement = elementsInstance.create('payment');
                    paymentElement.mount('#payment-element');
                }
            } catch (err) {
                console.warn('Błąd inicjalizacji płatności Stripe (może wymagać aktywnego backendu):', err);
            } finally {
                isFetchingIntent = false;
            }
        }

        // Obsługa wysłania formularza płatności
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!stripe || !elementsInstance) return;

            setLoading(true);

            const { error } = await stripe.confirmPayment({
                elements: elementsInstance,
                confirmParams: {
                    return_url: window.location.origin + '/success.html',
                },
            });

            if (error) {
                const messageDiv = document.getElementById('payment-message');
                messageDiv.innerText = error.message;
                messageDiv.classList.remove('hidden');
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            const submitBtn = document.getElementById('submit-btn');
            const buttonText = document.getElementById('button-text');
            submitBtn.disabled = isLoading;
            buttonText.innerText = isLoading ? 'Przetwarzanie...' : 'Zapłać teraz';
        }
    </script>
</body>
</html>
