<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustaw nowe hasło - 6WDzienniku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="https://files-6wdzienniku.vercel.app/content/6wd/logo_favicon_6.svg">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandViolet: '#5B21B6', brandPink: '#EC4899' },
                    fontFamily: { sans: ['"Open Sans"', 'sans-serif'], condensed: ['"Open Sans Condensed"', 'sans-serif'] },
                    borderRadius: { 'custom': '10px' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #FAFAFC; color: #1F2937; }
        h1, .font-condensed { font-family: 'Open Sans Condensed', sans-serif; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-gray-900 text-white px-5 py-3 rounded-custom shadow-xl border border-purple-500/30 flex items-center gap-3">
        <span id="toast-message" class="text-sm font-medium">Powiadomienie</span>
    </div>

    <header class="w-full bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <a href="https://6wdzienniku.vercel.app/">
                <img src="https://files-6wdzienniku.vercel.app/content/6wd/logo_6wdzienn_kolor.png" alt="6 w dzienniku" class="h-16 sm:h-20 object-contain">
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-custom border border-gray-200 shadow-md max-w-md w-full space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-condensed text-gray-900">Ustaw nowe hasło</h1>
                <p class="text-xs text-gray-500 mt-1">Wprowadź swoje nowe bezpieczne hasło poniżej.</p>
            </div>

            <form id="reset-password-form" onsubmit="handlePasswordUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nowe Hasło</label>
                    <input type="password" id="new-password" minlength="6" required placeholder="••••••••" class="w-full text-sm p-3 border rounded-custom focus:outline-none focus:border-brandViolet">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Powtórz Nowe Hasło</label>
                    <input type="password" id="confirm-password" minlength="6" required placeholder="••••••••" class="w-full text-sm p-3 border rounded-custom focus:outline-none focus:border-brandViolet">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3 bg-brandViolet text-white font-bold text-sm rounded-custom hover:bg-purple-800 transition">
                    Zapisz nowe hasło
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
        <div class="max-w-6xl mx-auto px-4 space-y-1">
            <p>© 2026 <b>6WDzienniku</b></p>
            <p>Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://fxksikgdberwgttvglko.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4a3Npa2dkYmVyd2d0dHZnbGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzU3NzYsImV4cCI6MjEwNjAxMTc3Nn0.sKf3vvVbaae5-mdg5zwqrgUl6AkXjENanwhDWbH_PXw";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const { error } = await supabase.auth.exchangeCodeForSession(code);
                if (error) {
                    showToast('Błąd weryfikacji linku: ' + error.message);
                } else {
                    showToast('Zweryfikowano link. Możesz teraz podać nowe hasło.');
                }
            }

            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
                    console.log('Stan autoryzacji:', event);
                }
            });
        });

        async function handlePasswordUpdate(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            if (newPassword !== confirmPassword) {
                showToast('Hasła nie są identyczne!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Zapisywanie...';

            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            btn.disabled = false;
            btn.innerText = 'Zapisz nowe hasło';

            if (error) {
                showToast('Błąd: ' + error.message);
            } else {
                showToast('Hasło zostało pomyślnie zmienione!');
                setTimeout(() => {
                    window.location.href = '/moje-konto';
                }, 2000);
            }
        }
    </script>
</body>
</html>
